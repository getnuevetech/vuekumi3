services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vuekumi
      POSTGRES_PASSWORD: vuekumi
      POSTGRES_DB: vuekumi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuekumi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional S3-compatible store. The API uses local disk unless Admin Settings
  # (or S3_* env) point at this endpoint.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vuekumi
      MINIO_ROOT_PASSWORD: vuekumi-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        mc alias set local http://minio:9000 vuekumi vuekumi-minio
        mc mb -p local/vuekumi || true

volumes:
  pgdata:
  minio:
