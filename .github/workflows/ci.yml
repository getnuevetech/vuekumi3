name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://vuekumi:vuekumi@localhost:5432/vuekumi
      JWT_SECRET: ci-jwt-secret-not-for-production-use
      COOKIE_SECRET: ci-cookie-secret-not-for-production
      CI: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuekumi
          POSTGRES_PASSWORD: vuekumi
          POSTGRES_DB: vuekumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuekumi -d vuekumi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @vuekumi/shared
      - run: npm run db:generate -w @vuekumi/api
      - run: npx tsc --noEmit -p apps/api
      - run: npm run typecheck -w @vuekumi/web
      - run: npm run lint -w @vuekumi/web
      - run: npm run db:migrate:deploy -w @vuekumi/api
      - run: npm run db:seed -w @vuekumi/api
      - run: npm test -w @vuekumi/api
      - run: npm exec -w @vuekumi/web -- vite build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Web smoke (Phases 45 + 55)
        run: npm run test:e2e

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t vuekumi-api:${{ github.sha }} .
      - name: Build web/nginx image
        run: docker build -f docker/nginx/Dockerfile -t vuekumi-web:${{ github.sha }} .
